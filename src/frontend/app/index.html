<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1120" />
    <meta
      name="description"
      content="A modern file sharing interface for StreamFile Server"
    />
    <title>StreamFile Server</title>
    <link rel="icon" href="/icons/server.svg" />
    <script>
      (function () {
        try {
          const preference = localStorage.getItem('streamfile-theme');
          if (preference === 'light' || preference === 'dark') {
            document.documentElement.dataset.theme = preference;
          }
        } catch (error) {
          // Storage unavailable; fall back to the default theme.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
